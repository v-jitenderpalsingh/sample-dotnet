name: Test both directories blocked - Windows

on: [push, workflow_dispatch]

permissions:
  contents: read

env:
  DOTNET_INSTALL_DIR: ''
  DOTNET_ROOT: ''

jobs:
  test:
    name: Test setup-dotnet
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Block default directory only
        shell: pwsh
        run: |
          $dir = "$env:ProgramFiles\dotnet"
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          if (!(Test-Path $dir -PathType Container)) {
            throw "Directory does not exist: $dir"
          }
          icacls $dir /deny "*${sid}:(WD,AD)"
          if ($LASTEXITCODE -ne 0) { throw "Cannot block $dir" }

      - name: Setup .NET
        id: setup
        uses: actions/setup-dotnet@main
        with:
          dotnet-version: |
            8.0.x
            7.0.x
      
      - name: verify versions
        run: |
          command -v dotnet
          dotnet --version
          dotnet --list-sdks
          dotnet --list-runtimes

  test-5:
