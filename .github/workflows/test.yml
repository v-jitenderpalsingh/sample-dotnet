name: Test Windows ACL fallback
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_INSTALL_DIR: ''
      DOTNET_ROOT: ''

    steps:
      - name: Prepare ACL test
        run: |
          $root = "$env:RUNNER_TEMP\dotnet-acl"
          $system = "$root\program-files\dotnet"
          $testHome = "$root\home"
          New-Item -ItemType Directory -Force -Path $system, "$testHome\.dotnet"

          $account = whoami
          icacls $system /deny "${account}:(WD)"
          if ($LASTEXITCODE -ne 0) { throw 'ACL setup failed' }

          New-Item -ItemType Directory "$system\folder-probe"
          Remove-Item "$system\folder-probe"
          try {
            [IO.File]::WriteAllText("$system\file-probe", 'test')
            throw 'Invalid test: file creation succeeded'
          } catch [UnauthorizedAccessException] {
            Write-Host 'Confirmed: folders allowed, files denied'
          }
          [IO.File]::WriteAllText("$testHome\.dotnet\probe", 'test')
          Remove-Item "$testHome\.dotnet\probe"

          "PROGRAMFILES=$root\program-files" >> $env:GITHUB_ENV
          "USERPROFILE=$testHome" >> $env:GITHUB_ENV

      - name: Test PR
        uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
        with:
          dotnet-version: '8.0.x'

      - name: Verify fallback
        run: |
          if ($env:DOTNET_ROOT -ne "$env:USERPROFILE\.dotnet") {
            throw "Home fallback not selected: $env:DOTNET_ROOT"
          }
          & "$env:DOTNET_ROOT\dotnet.exe" --list-sdks