name: Test Windows ACL fallback

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_INSTALL_DIR: ''
      DOTNET_ROOT: ''

    steps:
      - name: Prepare ACL test
        run: |
          $root = "$env:RUNNER_TEMP\dotnet-acl"
          $system = "$root\program-files\dotnet"
          $home = "$root\home"

          New-Item -ItemType Directory -Force -Path $system, "$home\.dotnet"

          $account = whoami
          icacls $system /deny "${account}:(WD)"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set ACL' }

          # Folder creation must succeed.
          New-Item -ItemType Directory "$system\folder-probe"
          Remove-Item "$system\folder-probe"

          # File creation must fail with access denied.
          try {
            [System.IO.File]::WriteAllText("$system\file-probe", 'test')
            throw 'ACL test failed: file creation was allowed'
          } catch [System.UnauthorizedAccessException] {
            Write-Host 'Confirmed: folders allowed, files denied'
          }

          # Home remains writable.
          [System.IO.File]::WriteAllText("$home\.dotnet\probe", 'test')
          Remove-Item "$home\.dotnet\probe"

          "PROGRAMFILES=$root\program-files" >> $env:GITHUB_ENV
          "USERPROFILE=$home" >> $env:GITHUB_ENV
          "HOME=$home" >> $env:GITHUB_ENV

      - name: Test PR
        uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
        with:
          dotnet-version: '8.0.x'

      - name: Verify home fallback
        run: |
          Write-Host "DOTNET_ROOT=$env:DOTNET_ROOT"
          if ($env:DOTNET_ROOT -ne "$env:USERPROFILE\.dotnet") {
            throw 'Home fallback was not selected'
          }
          & "$env:DOTNET_ROOT\dotnet.exe" --list-sdks