name: Test 518

on: [push, workflow_dispatch]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test 518 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      DOTNET_INSTALL_DIR: ''
      DOTNET_ROOT: ''

    steps:
      - uses: actions/checkout@main

      - name: Setup .NET
        uses: actions/setup-dotnet@main
        with:
          dotnet-version: '8.0.x'
      
      - name: Verify .NET installation
        run: |
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          command -v dotnet
          dotnet --version
          dotnet --list-sdks
          dotnet --list-runtimes
  

